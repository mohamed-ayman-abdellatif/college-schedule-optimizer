<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Automated Verification Test Suite</title>
</head>
<body>
  <h1>Test Runner</h1>
  <div id="test-results"></div>

  <!-- Load Modules -->
  <script src="js/parser.js"></script>
  <script src="js/pdfParser.js"></script>
  <script src="js/sampleData.js"></script>
  <script src="js/optimizer.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/exporter.js"></script>

  <script>
    const results = [];
    function assert(name, condition, extra = '') {
      results.push({ name, passed: Boolean(condition), extra });
      console.log(`[${condition ? 'PASS' : 'FAIL'}] ${name} ${extra}`);
    }

    // TEST 1: User's raw HTML parsing
    const userRawHtml = `<span id="ctl00_ContentPlaceHolder1_lbl_Title" dir="rtl" style="color:Black;font-family:Tahoma;font-weight:bold;text-decoration:underline;">   جدول المقرر :   Applied Programming - ECE2102</span>
    <span id="ctl00_ContentPlaceHolder1_Schedule1"><table cellspacing="0" rules="all" border="1">
	<tbody><tr>
		<th class="heading">&nbsp;</th><th class="heading"><span></span></th>
		<th class="heading"><span> 1 </span></th><th class="heading"><span> 2 </span></th><th class="heading"><span> 3 </span></th><th class="heading"><span> 4 </span></th>
		<th class="heading"><span> 5 </span></th><th class="heading"><span> 6 </span></th><th class="heading"><span> 7 </span></th><th class="heading"><span> 8 </span></th>
		<th class="heading"><span> 9 </span></th><th class="heading"><span> 10 </span></th><th class="heading"><span> 11 </span></th><th class="heading"><span> 12 </span></th>
		<th class="heading"><span> 13 </span></th><th class="heading"><span> 14 </span></th><th class="heading"><span> 15 </span></th><th class="heading"><span> 16 </span></th>
	</tr><tr>
		<th class="heading"><span>Saturday</span></th><td>&nbsp;</td>
		<td colspan="2"><span id="ctl00_ContentPlaceHolder1_Schedule1_item21_lbSelect">Group: E <br \=""> Lab. </span>
		<input type="hidden" name="item21_hd_Group" value="E"></td>
		<td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
	</tr><tr>
		<th class="heading"><span>Sunday</span></th><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
		<td colspan="2"><span id="item20_lbSelect">Group: B <br \=""> Lab. <br \=""> مجد نبيل نصرى نعمه </span>
		<input type="hidden" name="item20_hd_Group" value="B"></td>
		<td>&nbsp;</td><td>&nbsp;</td>
		<td colspan="2"><span id="item19_lbSelect">Group: L <br \=""> Lab. </span>
		<input type="hidden" name="item19_hd_Group" value="L"></td>
		<td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td>
	</tr><tr>
		<th class="heading" rowspan="4"><span>Tuesday</span></th><td rowspan="4">&nbsp;</td>
		<td colspan="2"><span id="item17_lbSelect">Group: F <br \=""> Lect. <br \=""> هشام صلاح الدين محمد رشاد </span>
		<input type="hidden" name="item17_hd_Group" value="F"></td>
		<td colspan="2" rowspan="2"><span id="item15_lbSelect">Group: B <br \=""> Lect. <br \=""> هشام صلاح الدين محمد رشاد </span>
		<input type="hidden" name="item15_hd_Group" value="B"></td>
		<td colspan="2" rowspan="3"><span id="item13_lbSelect">Group: H <br \=""> Lect. <br \=""> دينا محمد علي ابو الدهب </span>
		<input type="hidden" name="item13_hd_Group" value="H"></td>
		<td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td><td rowspan="4">&nbsp;</td>
	</tr><tr>
		<td colspan="2" rowspan="3"><span id="item16_lbSelect">Group: G <br \=""> Lect. <br \=""> هشام صلاح الدين محمد رشاد </span>
		<input type="hidden" name="item16_hd_Group" value="G"></td>
	</tr><tr>
		<td colspan="2" rowspan="2"><span id="item14_lbSelect">Group: C <br \=""> Lect. <br \=""> هشام صلاح الدين محمد رشاد </span>
		<input type="hidden" name="item14_hd_Group" value="C"></td>
	</tr><tr>
		<td colspan="2"><span id="item12_lbSelect">Group: I <br \=""> Lect. <br \=""> دينا محمد علي ابو الدهب </span>
		<input type="hidden" name="item12_hd_Group" value="I"></td>
	</tr>
	</tbody></table></span>`;

    const parsed = ScheduleParser.parseHtml(userRawHtml);
    assert('Parser returns success', parsed.success === true);
    assert('Extracted 1 course', parsed.courses.length === 1);
    const c1 = parsed.courses[0];
    assert('Course code is ECE2102', c1.code === 'ECE2102', c1.code);
    assert('Course name is Applied Programming', c1.name.includes('Applied Programming'), c1.name);

    // Check specific slots
    const grpE_lab = c1.slots.find(s => s.group === 'E' && s.type === 'Lab.');
    assert('Group E Lab is Saturday slots 1-2', grpE_lab && grpE_lab.day === 'Saturday' && grpE_lab.startSlot === 1 && grpE_lab.endSlot === 2);

    console.log("Extracted slots count:", c1.slots.length);
    const grpF_lect = c1.slots.find(s => s.group === 'F' && s.type === 'Lect.');
    assert('Group F Lecture doctor has د. prefix added automatically', grpF_lect && grpF_lect.instructor.startsWith('د. '), grpF_lect?.instructor);
    const grpB_lab = c1.slots.find(s => s.group === 'B' && s.type === 'Lab.');
    assert('Group B Lab exists', Boolean(grpB_lab));
    assert('Group B Lab instructor preserved without doctor title', grpB_lab && !grpB_lab.instructor.startsWith('د. ') && grpB_lab.instructor.includes('مجد نبيل'), grpB_lab?.instructor);


    // TEST 2: Optimizer runs across sample courses
    const sampleCourses = SampleScheduleData.DEFAULT_COURSE_SET;
    assert('Sample dataset has 7 courses', sampleCourses.length === 7);

    const optResult = ScheduleOptimizer.findOptimalSchedules(sampleCourses, {
      gapWeight: 80,
      daysWeight: 40,
      doctorWeight: 50
    });

    assert('Optimizer finds valid clash-free solutions', optResult.success && optResult.solutions.length > 0, `Count: ${optResult.solutions.length}`);
    const bestSol = optResult.solutions[0];
    assert('Best solution has clash-free sessions for all courses', bestSol.selectedGroups.length === sampleCourses.length);
    assert('Best solution has computed total gaps', typeof bestSol.totalGapSlots === 'number');
    assert('Best solution has campus days count', bestSol.activeDaysCount >= 2 && bestSol.activeDaysCount <= 7);

    // TEST 3: Doctor Preference Influence
    // Let's set Dr. Hisham as preferred for Applied Programming
    const optResultWithDoc = ScheduleOptimizer.findOptimalSchedules(sampleCourses, {
      doctorPreferences: {
        'ECE2102': { 'هشام صلاح الدين محمد رشاد': 'love' }
      },
      doctorWeight: 100,
      gapWeight: 10
    });

    const topDocSol = optResultWithDoc.solutions[0];
    const eceGroup = topDocSol.selectedGroups.find(g => g.courseCode === 'ECE2102');
    assert('Top doctor preference picks a group with preferred doctor', eceGroup.instructors.some(d => d.includes('هشام صلاح الدين')));

    // TEST 4: Exporter ICS Generation
    const icsText = ScheduleExporter.downloadIcsFile ? true : false;
    assert('Exporter module is defined and ready', Boolean(ScheduleExporter.exportToPng && ScheduleExporter.downloadIcsFile));

    // TEST 5: Prohibited / Blocked Times (User's Training Request)
    // Group E has Lab on Saturday slots 1-2. Let's block Saturday slots 1-2 (8:30 training).
    const optResultWithBlocked = ScheduleOptimizer.findOptimalSchedules(sampleCourses, {
      blockedTimes: [
        { day: 'Saturday', startSlot: 1, endSlot: 2, label: 'Training ⚽' }
      ]
    });
    assert('Optimizer succeeds with blocked training times', optResultWithBlocked.success && optResultWithBlocked.solutions.length > 0);
    // Check that NO solution has any session on Saturday slots 1 or 2
    let hasClashWithTraining = false;
    optResultWithBlocked.solutions.forEach(sol => {
      sol.sessions.forEach(sess => {
        if (sess.day === 'Saturday' && (sess.startSlot <= 2 && sess.endSlot >= 1)) {
          hasClashWithTraining = true;
        }
      });
    });
    assert('Zero sessions scheduled during prohibited Saturday 8:00 training', !hasClashWithTraining);

    // TEST 6: Distinct Subject Color Highlighting
    const colors = sampleCourses.map(c => c.color);
    const uniqueColors = new Set(colors);
    assert('All courses have distinct colors for timetable highlighting', uniqueColors.size === sampleCourses.length, `Colors: ${colors.join(', ')}`);
    const rgbaTest = ScheduleRenderer.hexToRgba('#3B82F6', 0.25);
    assert('hexToRgba correctly computes translucent background', rgbaTest === 'rgba(59, 130, 246, 0.25)', rgbaTest);

    // TEST 7: Doctor vs Instructor Classification & Dual Alphabetical Ordering
    const ece = sampleCourses.find(c => c.code === 'ECE2102');
    const getCleanSortName = n => (n || '').replace(/^(د\.|د\/|د\s+|Dr\.|Dr\s+|Doctor\s+|Prof\.|أ\.د\.?|م\.|Eng\.)\s*/i, '').trim();
    const isDoc = name => /^(د\.|د\/|د\s+|Dr\.|Dr\s+|Doctor\s+|Prof\.|أ\.د\.?)/i.test(name) ||
      ece.groups.some(g => g.sessions.some(s => s.instructor && s.instructor.includes(name) && (s.type === 'Lect.' || s.type.includes('Lect'))));
    
    const docs = ece.instructors.filter(i => isDoc(i));
    const insts = ece.instructors.filter(i => !isDoc(i));
    assert('Identified 3 doctors in ECE2102', docs.length === 3, docs.join(', '));
    assert('Identified 3 instructors/TAs in ECE2102', insts.length === 3, insts.join(', '));
    
    docs.sort((a, b) => getCleanSortName(a).localeCompare(getCleanSortName(b)));
    insts.sort((a, b) => getCleanSortName(a).localeCompare(getCleanSortName(b)));
    assert('Doctors sorted alphabetically (Dina, Hesham, Yara)', docs[0].includes('دينا') && docs[1].includes('هشام') && docs[2].includes('يارا'));
    assert('Instructors sorted alphabetically (Ahmed, Magd, Mohamed)', insts[0].includes('احمد') && insts[1].includes('مجد') && insts[2].includes('محمد'));

    // TEST 8: Same-Doctor Same-Subject Lecture Merging & Yellow Warning
    assert('isLectureSession correctly identifies lectures',
      ScheduleRenderer.isLectureSession({ type: 'Lect.' }) === true &&
      ScheduleRenderer.isLectureSession({ type: 'محاضرة' }) === true &&
      ScheduleRenderer.isLectureSession({ type: 'Lab.' }) === false
    );

    assert('isSameDoctor matches identical and title-prefixed doctor names',
      ScheduleRenderer.isSameDoctor('د. هشام صلاح الدين', 'Dr. هشام صلاح الدين') === true &&
      ScheduleRenderer.isSameDoctor('د. هشام صلاح الدين', 'هشام صلاح الدين') === true &&
      ScheduleRenderer.isSameDoctor('د. هشام', 'د. دينا') === false &&
      ScheduleRenderer.isSameDoctor('Not Specified', 'Not Specified') === false
    );

    // Group B and Group C both have Tuesday slots 3-4 lecture with Dr. Hesham
    const grpB_lect = {
      courseId: 'ECE2102',
      courseCode: 'ECE2102',
      courseName: 'Applied Programming',
      group: 'B',
      type: 'Lect.',
      day: 'Tuesday',
      startSlot: 3,
      endSlot: 4,
      instructor: 'د. هشام صلاح الدين محمد رشاد'
    };
    const grpC_lect = {
      courseId: 'ECE2102',
      courseCode: 'ECE2102',
      courseName: 'Applied Programming',
      group: 'C',
      type: 'Lect.',
      day: 'Tuesday',
      startSlot: 3,
      endSlot: 4,
      instructor: 'د. هشام صلاح الدين محمد رشاد'
    };

    const merged = ScheduleRenderer.mergeSameDoctorLectures([grpB_lect, grpC_lect]);
    assert('Same-doctor lectures merge into exactly 1 session', merged.length === 1);
    assert('Merged session has group letters beside each other (B, C)', merged[0] && merged[0].group === 'B, C', merged[0]?.group);
    assert('Merged session is flagged as isMergedLecture', merged[0] && merged[0].isMergedLecture === true);

    // Verify non-matching sessions do not merge
    const diffDocLect = {
      courseId: 'ECE2102',
      courseCode: 'ECE2102',
      courseName: 'Applied Programming',
      group: 'H',
      type: 'Lect.',
      day: 'Tuesday',
      startSlot: 3,
      endSlot: 4,
      instructor: 'د. دينا محمد علي ابو الدهب'
    };
    const notMerged = ScheduleRenderer.mergeSameDoctorLectures([grpB_lect, diffDocLect]);
    assert('Different doctor lectures do NOT merge', notMerged.length === 2);

    const labSession = {
      courseId: 'ECE2102',
      courseCode: 'ECE2102',
      courseName: 'Applied Programming',
      group: 'B',
      type: 'Lab.',
      day: 'Tuesday',
      startSlot: 3,
      endSlot: 4,
      instructor: 'مجد نبيل'
    };
    const labNotMerged = ScheduleRenderer.mergeSameDoctorLectures([grpB_lect, labSession]);
    assert('Lab session does not merge with lecture', labNotMerged.length === 2);

    // TEST 9: Robust Doctor Name Matching & Substring Collision Prevention
    assert('matchesDoctor matches normalized Arabic names with titles',
      ScheduleOptimizer.matchesDoctor('د. هشام صلاح الدين محمد رشاد', 'هشام صلاح الدين محمد رشاد') === true &&
      ScheduleOptimizer.matchesDoctor('Dr. Hesham Salah', 'د. هشام صلاح') === false
    );
    assert('matchesDoctor matches prefix token names',
      ScheduleOptimizer.matchesDoctor('د. هشام صلاح الدين', 'هشام صلاح الدين محمد رشاد') === true
    );
    assert('matchesDoctor PREVENTS false positive on shared father/common name (محمد)',
      ScheduleOptimizer.matchesDoctor('د. هشام صلاح الدين محمد رشاد', 'د. محمد حسام') === false &&
      ScheduleOptimizer.matchesDoctor('د. دينا محمد علي ابو الدهب', 'د. محمد علي') === false &&
      ScheduleOptimizer.matchesDoctor('د. محمد', 'د. محمد علي') === false &&
      ScheduleOptimizer.matchesDoctor('د. محمد حسام', 'د. محمد علي') === false
    );

    // TEST 10: Strict Avoid Exclusion when non-avoided alternatives exist
    // ECE2102 has multiple doctors (Dr. Hesham, Dr. Dina, Dr. Yara).
    // Avoiding Dr. Hesham should produce solutions strictly excluding Dr. Hesham when alternatives exist.
    const optResultAvoidHesham = ScheduleOptimizer.findOptimalSchedules(sampleCourses, {
      doctorPreferences: {
        'ECE2102': { 'هشام صلاح الدين محمد رشاد': 'avoid' }
      }
    });
    assert('Optimizer succeeds when an avoided doctor has valid alternatives', optResultAvoidHesham.success && optResultAvoidHesham.solutions.length > 0);
    const hasAvoidedInSol = optResultAvoidHesham.solutions[0].selectedGroups
      .find(g => g.courseCode === 'ECE2102')
      .instructors.some(inst => ScheduleOptimizer.matchesDoctor(inst, 'هشام صلاح الدين محمد رشاد'));
    assert('Solutions strictly exclude Dr. Hesham when valid alternative groups exist', !hasAvoidedInSol);

    // TEST 11: Tier 3 Fallback - Avoided Doctor Never Falsely Fails When Forced
    // Create a 2-course mini schedule where course 1 ONLY has 1 doctor (Dr. Sole)
    const singleDocCourse = {
      id: 'SOL101',
      code: 'SOL101',
      name: 'Sole Course',
      instructors: ['د. سليمان فؤاد عزيز'],
      groups: [
        {
          group: 'A',
          sessions: [{ type: 'Lect.', day: 'Sunday', startSlot: 1, endSlot: 2, instructor: 'د. سليمان فؤاد عزيز' }],
          instructors: ['د. سليمان فؤاد عزيز']
        }
      ]
    };
    const otherCourse = {
      id: 'OTH101',
      code: 'OTH101',
      name: 'Other Course',
      instructors: ['د. طارق محمود'],
      groups: [
        {
          group: 'A',
          sessions: [{ type: 'Lect.', day: 'Sunday', startSlot: 3, endSlot: 4, instructor: 'د. طارق محمود' }],
          instructors: ['د. طارق محمود']
        }
      ]
    };
    // User strictly marks the sole professor as Avoid!
    const optResultSoleAvoid = ScheduleOptimizer.findOptimalSchedules([singleDocCourse, otherCourse], {
      doctorPreferences: {
        'SOL101': { 'د. سليمان فؤاد عزيز': 'avoid' }
      }
    });
    assert('Tier 3 fallback discovers clash-free schedule even if sole doctor is avoided', optResultSoleAvoid.success === true && optResultSoleAvoid.solutions.length > 0);
    assert('Fallback notice accurately alerts user that an avoided doctor was necessary', Boolean(optResultSoleAvoid.fallbackNotice));
    assert('Solution has avoid-included badge', optResultSoleAvoid.solutions[0].badges.some(b => b.type === 'avoid-included'));

    // TEST 12: Tier 2 Fallback - Conflicting Mandates Return Best Schedules
    // Create 2 courses where Group A of Course 1 and Group A of Course 2 clash at Sunday slots 1-2,
    // and each has a different mandated doctor.
    const clashCourse1 = {
      id: 'CL1',
      code: 'CL1',
      name: 'Clash Course 1',
      instructors: ['د. اشرف رفعت'],
      groups: [
        {
          group: 'A',
          sessions: [{ type: 'Lect.', day: 'Sunday', startSlot: 1, endSlot: 2, instructor: 'د. اشرف رفعت' }],
          instructors: ['د. اشرف رفعت']
        }
      ]
    };
    const clashCourse2 = {
      id: 'CL2',
      code: 'CL2',
      name: 'Clash Course 2',
      instructors: ['د. حسام بدير', 'د. سامح كمال'],
      groups: [
        {
          group: 'A',
          sessions: [{ type: 'Lect.', day: 'Sunday', startSlot: 1, endSlot: 2, instructor: 'د. حسام بدير' }],
          instructors: ['د. حسام بدير']
        },
        {
          group: 'B',
          sessions: [{ type: 'Lect.', day: 'Monday', startSlot: 1, endSlot: 2, instructor: 'د. سامح كمال' }],
          instructors: ['د. سامح كمال']
        }
      ]
    };
    // User mandates BOTH Dr. Ashraf (CL1 Group A) and Dr. Hossam (CL2 Group A) who clash at Sunday 1-2!
    const optResultConflictingMandates = ScheduleOptimizer.findOptimalSchedules([clashCourse1, clashCourse2], {
      doctorPreferences: {
        'CL1': { 'د. اشرف رفعت': 'mandate' },
        'CL2': { 'د. حسام بدير': 'mandate' }
      }
    });
    assert('Tier 2 fallback succeeds when mandated doctors clash with each other', optResultConflictingMandates.success === true && optResultConflictingMandates.solutions.length > 0);
    assert('Tier 2 selects non-clashing alternative (Group B) for clash-free schedule',
      optResultConflictingMandates.solutions[0].selectedGroups.find(g => g.courseCode === 'CL2').group === 'B'
    );
    assert('Fallback notice informs user of conflicting mandated hours', Boolean(optResultConflictingMandates.fallbackNotice));

    // TEST 13: Strict Doctor Mode (Exhaustive Search)
    const optResultStrictSuccess = ScheduleOptimizer.findOptimalSchedules(sampleCourses, {
      strictDoctorMode: true,
      doctorPreferences: {
        'ECE2102': {
          'هشام صلاح الدين محمد رشاد': 'avoid',
          'دينا محمد علي ابو الدهب': 'love'
        }
      }
    });
    assert('Strict Doctor Mode succeeds when non-avoided desired combination exists',
      optResultStrictSuccess.success === true && optResultStrictSuccess.solutions.length > 0
    );
    assert('Strict Doctor Mode calculates totalCombinationsPossible',
      typeof optResultStrictSuccess.totalCombinationsPossible === 'number' && optResultStrictSuccess.totalCombinationsPossible > 0
    );
    const bestStrictSol = optResultStrictSuccess.solutions[0];
    const ecePick = bestStrictSol.selectedGroups.find(g => g.courseCode === 'ECE2102');
    assert('Strict Doctor Mode picks desired doctor (Dr. Dina)',
      ecePick.instructors.some(inst => ScheduleOptimizer.matchesDoctor(inst, 'دينا محمد علي ابو الدهب'))
    );
    assert('Strict Doctor Mode strictly excludes avoided doctor (Dr. Hesham)',
      !ecePick.instructors.some(inst => ScheduleOptimizer.matchesDoctor(inst, 'هشام صلاح الدين محمد رشاد'))
    );

    // TEST 14: Strict Doctor Mode - Never returns avoided doctor even if sole lecturer
    const optResultStrictSoleAvoid = ScheduleOptimizer.findOptimalSchedules([singleDocCourse, otherCourse], {
      strictDoctorMode: true,
      doctorPreferences: {
        'SOL101': { 'د. سليمان فؤاد عزيز': 'avoid' }
      }
    });
    assert('Strict Doctor Mode refuses to return avoided doctor (returns success: false)',
      optResultStrictSoleAvoid.success === false && optResultStrictSoleAvoid.solutions.length === 0
    );
    assert('Strict Doctor Mode provides total combinations and diagnostic message',
      Boolean(optResultStrictSoleAvoid.totalCombinationsPossible && optResultStrictSoleAvoid.message)
    );

    // TEST 15: Strict Doctor Mode with Conflicting Desired Doctors
    const optResultStrictConflict = ScheduleOptimizer.findOptimalSchedules([clashCourse1, clashCourse2], {
      strictDoctorMode: true,
      doctorPreferences: {
        'CL1': { 'د. اشرف رفعت': 'love' },
        'CL2': { 'د. حسام بدير': 'love', 'د. سامح كمال': 'neutral' }
      }
    });
    assert('Strict Doctor Mode handles conflicting desired doctors gracefully',
      optResultStrictConflict.success === true && optResultStrictConflict.solutions.length > 0
    );
    assert('Strict Doctor Mode falls back to non-clashing alternative with fallback notice',
      Boolean(optResultStrictConflict.fallbackNotice)
    );

    // ==========================================
    // PDF TIMETABLE PARSER TESTS (aSc & AAST)
    // ==========================================

    // TEST 16: Period to Slot Mapping
    const p1 = PdfScheduleParser.mapPeriodToSlots(1);
    const p3 = PdfScheduleParser.mapPeriodToSlots(3);
    const p6 = PdfScheduleParser.mapPeriodToSlots(6);
    assert('Period 1 maps to slots 1-2 (08:30-10:20)', p1.startSlot === 1 && p1.endSlot === 2);
    assert('Period 3 maps to slots 5-6 (12:30-14:20)', p3.startSlot === 5 && p3.endSlot === 6);
    assert('Period 6 maps to slots 11-12 (18:30-20:20)', p6.startSlot === 11 && p6.endSlot === 12);

    // TEST 17: Day Normalization & Group Header Extraction
    assert('normalizeDay normalizes Arabic days',
      PdfScheduleParser.normalizeDay('سبت') === 'Saturday' &&
      PdfScheduleParser.normalizeDay('احد') === 'Sunday' &&
      PdfScheduleParser.normalizeDay('اثنین') === 'Monday' &&
      PdfScheduleParser.normalizeDay('ثلاثاء') === 'Tuesday' &&
      PdfScheduleParser.normalizeDay('اربعاء') === 'Wednesday' &&
      PdfScheduleParser.normalizeDay('خميس') === 'Thursday'
    );
    assert('extractGroupFromHeader parses aSc group format (05EME01_144 -> 1)',
      PdfScheduleParser.extractGroupFromHeader('05EME01_144') === '1' &&
      PdfScheduleParser.extractGroupFromHeader('05EME08_144') === '8'
    );
    assert('extractGroupFromHeader parses standard group formats',
      PdfScheduleParser.extractGroupFromHeader('Group 3') === '3' &&
      PdfScheduleParser.extractGroupFromHeader('المجموعة: B') === 'B'
    );

    // TEST 18: Cell Content Parsing
    const sampleCell1 = `EEC3301 Electronics 1 Sec\nBA E Asmaa Abdel Moteleb /\nالبشیر عادل يوسف محمد\nB 202|Class room`;
    const parsedCell1 = PdfScheduleParser.parseCellContent(sampleCell1, 'Saturday', 1, '1');
    assert('parseCellContent parses course code and clean name (using course number only)',
      parsedCell1 && parsedCell1.courseCode === 'EEC3301' && parsedCell1.courseName === 'EEC3301'
    );
    assert('parseCellContent parses section type and strips room number',
      parsedCell1 && parsedCell1.sessionType === 'Sec.' && parsedCell1.room === ''

    // Scenario A: When user has impossible free days (e.g. 3 days off that leave no room for 7 courses)
    const impossibleFreeDays = ['Sunday', 'Tuesday', 'Thursday'];
    const relaxedFreeDaysRes = ScheduleOptimizer.findOptimalSchedules(sampleCourses, {
      freeDays: impossibleFreeDays
    });
    assert('Optimizer automatically relaxes impossible free days to find clash-free schedules',
      relaxedFreeDaysRes.success === true && relaxedFreeDaysRes.solutions.length > 0 &&
      relaxedFreeDaysRes.fallbackMode === 'relaxed-free-days'
    );

    // Scenario B: When all groups of courses overlap with evening blocked times
    const heavyEveningBlocked = [];
    ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday'].forEach(day => {
      for (let sl = 1; sl <= 16; sl++) {
        // Block afternoon/evening
        if (sl >= 5) heavyEveningBlocked.push({ day, slot: sl, startSlot: sl, endSlot: sl });
      }
    });
    const relaxedBlockedRes = ScheduleOptimizer.findOptimalSchedules(sampleCourses, {
      blockedTimes: heavyEveningBlocked
    });
    assert('Optimizer automatically relaxes conflicting blocked times to find clash-free schedules',
      relaxedBlockedRes.success === true && relaxedBlockedRes.solutions.length > 0 &&
      (relaxedBlockedRes.fallbackMode === 'relaxed-blocked-times' || relaxedBlockedRes.fallbackMode === 'relaxed-free-and-blocked')
    );

    // Scenario C: Badges are populated for relaxed solutions
    assert('Relaxed solutions receive descriptive badges explaining the relaxation',
      relaxedFreeDaysRes.solutions[0].badges.some(b => b.type === 'free-days-relaxed')
    );

    // Summary
    const passedCount = results.filter(r => r.passed).length;
    const failedCount = results.filter(r => !r.passed).length;
    document.getElementById('test-results').innerHTML = `
      <h2>Tests Passed: ${passedCount} / ${results.length} (Failed: ${failedCount})</h2>
      <ul>${results.map(r => `<li style="color: ${r.passed ? 'green' : 'red'};">[${r.passed ? 'PASS' : 'FAIL'}] ${r.name} ${r.extra}</li>`).join('')}</ul>
    `;
    window.testSuiteComplete = true;
    window.testSuitePassed = (failedCount === 0);
  </script>
</body>
</html>
